services:
  - type: web
    name: teras-lmbur-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @teras-lmbur/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: API_PREFIX
        value: /api/v1
